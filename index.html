<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FI307 布线查询</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first field tool — sticky header with search, room tabs, cabinet grid, then a per-cabinet link list grouped by device U position. */
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#18212b; --muted:#5d6b7a; --line:#d5dbe2;
  --accent:#e2701b; --accent-ink:#ffffff; --accent-soft:#fbe7d6;
  --a:#1f6fb8; --a-soft:#dde9f6; --b:#a2398f; --b-soft:#f3e0ef; --ok:#2f7d4f; --err:#c23a2b;
  --net:#c8322a; --net-soft:#fbe3e1; --c:#2f7d4f; --c-soft:#dff1e6;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171d; --panel:#1b222a; --ink:#e6ebf0; --muted:#93a1b0; --line:#2c3640;
  --accent:#f08a3a; --accent-ink:#1a1206; --accent-soft:#3a2716;
  --a:#6aaef0; --a-soft:#1c2c3d; --b:#e08ad0; --b-soft:#36213a; --ok:#5fc08a; --err:#f07a6b; --net:#f2786e; --net-soft:#3d1f1d; --c:#5fc08a; --c-soft:#1b3326; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --panel:#1b222a; --ink:#e6ebf0; --muted:#93a1b0; --line:#2c3640;
  --accent:#f08a3a; --accent-ink:#1a1206; --accent-soft:#3a2716;
  --a:#6aaef0; --a-soft:#1c2c3d; --b:#e08ad0; --b-soft:#36213a; --ok:#5fc08a; --err:#f07a6b; --net:#f2786e; --net-soft:#3d1f1d; --c:#5fc08a; --c-soft:#1b3326; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* lock */
#lock{min-height:100vh;display:grid;place-items:center;padding-block:40px}
.lockcard{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:28px 22px;display:grid;gap:14px}
.brand{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.02em;line-height:1}
.brand b{color:var(--accent)}
.lockcard label{font-weight:600;font-size:17px}
.lockcard input{width:100%;font:16px var(--f-body);padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.lockcard input:focus{outline:2px solid var(--accent);outline-offset:1px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:12px;font-weight:700;cursor:pointer}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.msg{min-height:1.4em;font-size:14px;color:var(--err)}
.sub{color:var(--muted);font-size:13px}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px;padding-block:10px 8px}
.hrow .brand{font-size:24px;flex:0 0 auto}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;font:16px var(--f-body);padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.search input:focus{outline:2px solid var(--accent);outline-offset:0}
.results{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:8px;max-height:60vh;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.results button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 12px;cursor:pointer}
.results button:last-child{border-bottom:0}
.results button:hover,.results button:focus-visible{background:var(--accent-soft);outline:none}
.results .k{font-size:12px;color:var(--muted);white-space:nowrap}
.rooms{display:flex;gap:6px;padding-bottom:10px;overflow-x:auto}
.rooms button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 14px;font-family:var(--f-display);font-size:18px;font-weight:600;cursor:pointer}
.rooms button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:6px;padding-block:12px}
.cab{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 4px 5px;cursor:pointer;display:grid;justify-items:center;gap:0}
.cab .n{font-family:var(--f-display);font-size:21px;font-weight:700;line-height:1}
.cab .c{font-size:11px;color:var(--muted)}
.cab.odf{border-style:dashed}
.cab[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cab[aria-current="true"] .c{color:var(--accent-ink)}
.cab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.foldbar{display:flex;justify-content:space-between;align-items:center;padding-top:10px;color:var(--muted);font-size:13px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:4px 0}

/* cabinet */
.cabhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-block:16px 4px}
.cabhead h1{margin:0;font-family:var(--f-display);font-size:40px;line-height:1;font-weight:700;letter-spacing:.01em}
.cabhead h1 small{font-size:22px;color:var(--muted);font-weight:600;margin-right:6px}
.cabhead .sum{color:var(--muted);font-size:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-block:10px 8px}
.seg button{flex:1;background:var(--panel);border:0;border-right:1px solid var(--line);padding:9px 4px;font-weight:600;cursor:pointer;font-size:14px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:8px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.elev{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px}
.elev button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer;text-align:left;max-width:180px}
.elev button b{font-family:var(--f-mono);margin-right:4px;color:var(--accent)}

.dev{margin-block:14px 0}
.devh{display:flex;align-items:baseline;gap:8px;padding-block:6px;border-bottom:2px solid var(--ink);position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh,96px));background:var(--bg);z-index:2}
.devh .u{font-family:var(--f-mono);font-weight:600;background:var(--ink);color:var(--bg);border-radius:4px;padding:1px 6px;font-size:13px}
.devh .name{font-weight:700;min-width:0;overflow-wrap:anywhere}
.devh .cnt{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
.ln{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.port{font-family:var(--f-mono);font-weight:600;font-size:14px;align-self:start;min-width:3.4em;padding-top:1px}
.port .lno{display:block;font-size:15px;color:var(--accent);font-weight:700}
.port span{display:block;font-size:11px;color:var(--muted);font-weight:400}
.peer{min-width:0}
.dir{display:inline-block;font-size:11px;font-weight:700;border-radius:3px;padding:0 5px;margin-right:6px;vertical-align:2px}
.dir.to{background:var(--a-soft);color:var(--a)}
.dir.from{background:var(--b-soft);color:var(--b)}
.dir.in{background:var(--accent-soft);color:var(--accent)}
.where{font-family:var(--f-display);font-size:21px;font-weight:700;line-height:1.15}
.where button{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.where .uu{font-family:var(--f-mono);font-size:15px;font-weight:600;margin-left:6px;color:var(--accent)}
.pdev{font-size:14px;overflow-wrap:anywhere}
.pdev .mono{color:var(--muted)}
.meta{grid-column:2;display:flex;gap:5px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.meta span{border:1px solid var(--line);border-radius:4px;padding:0 5px}
.meta .ra{color:var(--a);border-color:var(--a)}
.meta .rb{color:var(--b);border-color:var(--b)}
.vt{margin-left:auto;font-weight:600;border-color:var(--ink)}
.tsum{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);padding-bottom:4px}
.tsum b{color:var(--ink);font-family:var(--f-mono)}
.ct{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.ct td{padding:5px 3px;border-bottom:1px solid var(--line);vertical-align:baseline}
.ct .cp{font-family:var(--f-mono);font-weight:600;white-space:nowrap;width:1%}
.ct .ca{font-weight:700;width:1%;text-align:center}
.ct .ca.to{color:var(--a)}.ct .ca.from{color:var(--b)}.ct .ca.in{color:var(--accent)}
.ct .cc{white-space:nowrap;width:1%;font-family:var(--f-display);font-size:17px;font-weight:700}
.ct .cc button{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.ct .cu{font-family:var(--f-mono);font-weight:600;color:var(--accent);white-space:nowrap;width:1%}
.ct .cd{overflow-wrap:anywhere;font-size:12px}
.ct .cd i{font-style:normal;color:var(--muted);font-family:var(--f-mono);white-space:nowrap}
.ct .cr{width:1%;font-size:11px;font-weight:700;text-align:right}
.ct .rA{color:var(--a)}.ct .rB{color:var(--b)}
.vseg{display:flex;gap:6px;padding-bottom:10px}
.vseg button{flex:1;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 4px;font-size:13px;font-weight:600;cursor:pointer}
.vseg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pkg{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px;margin-block:8px 4px;font-size:13px;overflow-wrap:anywhere}
.pkgc{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pkgc button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:3px 9px;font-family:var(--f-display);font-size:17px;font-weight:700;cursor:pointer}
.pkgc button.me{border-color:var(--accent);color:var(--accent)}
.pkgbtn{padding:9px;font-size:14px}
.warn{color:var(--err)}
.swtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.swtabs button{flex:1 0 auto;display:grid;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 10px;cursor:pointer;text-align:left;font-size:12px}
.swtabs button b{font-family:var(--f-display);font-size:18px}
.swtabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rulehead{padding-block:4px 8px;font-size:15px}
.rcols{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px;border-top:2px solid var(--ink);padding-top:6px}
.rch{font-family:var(--f-display);font-size:20px;font-weight:700;line-height:1.1;padding-bottom:4px;border-bottom:1px solid var(--line)}
.rch.me{color:var(--accent)}
.rch small{display:block;font-family:var(--f-body);font-size:11px;font-weight:400;color:var(--muted)}
.rr{display:flex;gap:8px;align-items:baseline;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:14px;line-height:1.55;border-bottom:1px dotted var(--line)}
.rp{min-width:2.4em;text-align:right;font-weight:600;color:var(--muted)}
.ru{font-weight:600;color:var(--accent);white-space:nowrap}
.rr2{align-items:center}
.subs{display:grid;gap:0;flex:1;min-width:0}
.sub1{font-weight:600;color:var(--accent);white-space:nowrap;font-size:13px}
.sub1 b{color:var(--ink);font-weight:600;display:inline-block;min-width:3.6em}
.rr i{font-style:normal;font-size:11px;color:var(--muted)}
.legend{font-size:11px;color:var(--muted);padding-bottom:6px}
.legend .to,.sa.to{color:var(--a)}.legend .from,.sa.from{color:var(--b)}.sa.in{color:var(--accent)}
.sumlist{border-top:2px solid var(--ink)}
.srow{display:grid;gap:2px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;overflow-wrap:anywhere}
.srow i{font-style:normal;font-family:var(--f-mono);color:var(--muted)}
.su{font-family:var(--f-mono);font-weight:600;color:var(--accent)}
.sl{font-weight:600}.nw{white-space:nowrap}
.sp{font-size:14px}
.sa{font-size:16px;margin-right:6px}
.sp button{background:none;border:0;padding:0;font-family:var(--f-display);font-size:19px;font-weight:700;color:inherit;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.sm{font-size:11px;color:var(--muted)}.sm b{color:var(--ink);font-family:var(--f-mono)}
.sm .rA{color:var(--a)}.sm .rB{color:var(--b)}
.empty{padding:28px 0;color:var(--muted);text-align:center}
footer{color:var(--muted);font-size:12px;padding-block:24px 32px;text-align:center}
@media (prefers-reduced-motion:no-preference){.cab,.chip,.seg button{transition:background .12s,border-color .12s}}

/* language */
.langsel{display:flex;gap:6px}
.langsel button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px;font-weight:700;cursor:pointer}
.langsel button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.langbtn{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:inherit;font-family:inherit;border-radius:8px;padding:8px 9px;font-size:13px;font-weight:700;cursor:pointer}
/* rack progress */
.cab .pb{display:flex;gap:2px;margin-top:3px}
.cab .pb i{font-style:normal;font-size:10px;font-weight:700;line-height:1;padding:2px 3px;border-radius:3px;border:1px solid var(--line);color:var(--muted)}
.cab .pb i.on{background:var(--ok);border-color:var(--ok);color:#fff}
.cab.pf{background:linear-gradient(to top,color-mix(in srgb,var(--ok) 30%,var(--panel)) var(--fill),var(--panel) var(--fill))}
.cab.done{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok);background:color-mix(in srgb,var(--ok) 30%,var(--panel))}
.cab.done .n{color:var(--ok)}
.cab[aria-current="true"].pf,.cab[aria-current="true"].done{background:var(--accent)}
.cab[aria-current="true"].done .n{color:var(--accent-ink)}
.cab[aria-current="true"] .pb i:not(.on){border-color:currentColor;color:inherit}
.progsum{font-size:13px;color:var(--muted);padding-top:10px;display:flex;gap:4px 12px;flex-wrap:wrap}
.progsum b{color:var(--ink);font-variant-numeric:tabular-nums}
.prog{display:grid;gap:6px;margin:8px 0 10px}
.pr{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap}
.pr.done{border:1px solid var(--ok);border-radius:8px;padding:8px 10px;background:color-mix(in srgb,var(--ok) 12%,transparent)}
.pr .pk{font-weight:700;color:var(--ok)}
.pr .pt{font-size:12px;color:var(--muted)}
.pby{color:var(--ink)}
.pundo{border-color:var(--accent);color:var(--accent)}
.pgpk{font-size:13px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.pgp{color:var(--muted);font-weight:400;font-size:12px}
#mrename{font-size:13px}
.mwarn{color:var(--err);font-size:13px}
#msel{width:100%;font:16px var(--f-body);padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.pgall{padding-block:6px 12px}
.pgroom{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:6px 0}
.pgroom button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 12px;font-family:var(--f-display);font-size:17px;font-weight:600;cursor:pointer}
.pgroom .progsum{padding-top:0}
.pgper{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.pgper b{color:var(--ok)}
.pglog{display:grid;gap:0;border-top:2px solid var(--ink)}
.pglog button{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"r x t" "r b t";gap:0 10px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:7px 2px;cursor:pointer;font-size:13px}
.pglog .pgr{grid-area:r;font-family:var(--f-display);font-size:18px;min-width:5.5em}
.pglog .pgx{grid-area:x;color:var(--ok);font-weight:600}
.pglog .pgb{grid-area:b;font-weight:700}
.pglog .pgt{grid-area:t;color:var(--muted);font-family:var(--f-mono);font-size:12px}
.pclr{margin-left:auto;border:1px solid var(--err);color:var(--err);background:none;border-radius:6px;padding:4px 10px;cursor:pointer;font-weight:600}
.pbtn{width:100%;border:1px dashed var(--ok);background:var(--panel);color:var(--ok);border-radius:8px;padding:11px 10px;font-weight:700;cursor:pointer}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:16px}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:380px;width:100%;display:grid;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.mt{font-weight:700;font-size:18px}
.mb p{margin:0 0 6px}
.mbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mcancel{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:12px;font-weight:700;cursor:pointer}
#minput{font:16px var(--f-body);padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;z-index:60;font-size:14px;max-width:calc(100% - 32px)}

/* rack wiring map */
.rk-legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);padding-bottom:6px;align-items:center}
.rk-rule{font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin-bottom:8px;line-height:1.5}
.rk-wrap{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px}
.rk h3{margin:0 0 4px;font-family:var(--f-display);font-size:22px;line-height:1.1}
.rk h3 small{display:block;font-family:var(--f-body);font-size:11px;font-weight:400;color:var(--muted)}
.rk h3.me{color:var(--accent)}
.rk-grid{display:grid;grid-template-columns:2.1em minmax(0,1fr);grid-auto-rows:minmax(24px,auto);border:2px solid var(--ink);border-radius:4px;background:var(--panel)}
.rk-u{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:right;padding-right:4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:flex-end}
.rk-d{border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-content:center;gap:2px 3px;padding:1px 3px;min-width:0}
.rk-d.srv{background:var(--panel)}
.rk-d.inf{background:var(--bg);color:var(--muted);font-size:10px;justify-content:center}
.rk-d.sw{background:var(--ink);color:var(--bg);font-weight:700;font-size:11px;justify-content:center;font-family:var(--f-mono)}
.rk-d.sw span{font-weight:400;opacity:.8;margin-left:4px}
.rk-d.empty{background:transparent}
.rk-warn{font-size:12px;color:var(--err);border:1px solid var(--err);border-radius:6px;padding:6px 8px;margin-bottom:8px;line-height:1.5}
.rk-d.warnsw{outline:2px dashed var(--err);outline-offset:-2px}
.rooms .pkgtab{border-color:var(--accent);color:var(--accent)}
.rooms .pkgtab[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;padding-block:12px}
.pcard{display:grid;gap:2px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 12px;cursor:pointer;min-width:0;overflow-wrap:anywhere}
.pcard b{font-size:14px}.pcard small{color:var(--muted);font-size:12px}.pcard span{font-size:13px;color:var(--accent);font-weight:600}
.pcard.on{border-color:var(--accent);background:var(--accent-soft)}
.maplink{display:inline-block;margin-bottom:8px;color:var(--accent);font-weight:600}
.pkgstat{color:var(--muted);font-size:13px;padding-block:4px 8px}
.pkh{font-family:var(--f-display);font-size:22px;margin:14px 0 6px}
.pgroups{display:grid;gap:6px}
.pg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:6px}
.pgn{font-family:var(--f-mono);color:var(--muted);min-width:1.6em;font-size:12px}
.pg button{display:grid;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:3px 10px;cursor:pointer;font-family:var(--f-display);font-size:18px;font-weight:700;text-align:left;line-height:1.1}
.pg button small{font-family:var(--f-body);font-size:10px;font-weight:400;color:var(--muted)}
.rk-src{font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin-bottom:8px;display:grid;gap:4px;line-height:1.5}
.rk-srow{display:flex;gap:6px;align-items:baseline}.rk-srow>span:last-child{min-width:0;overflow-wrap:anywhere}
.rk-flowwrap{position:relative;padding-top:calc(var(--lanes) * 15px + 10px)}
.rk-flowwrap .rk{padding-left:calc(var(--lanes) * 7px + 8px)}
.rk-flowwrap.noflow{padding-top:0}.rk-flowwrap.noflow .rk{padding-left:0}
.rk-svg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.fl{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;opacity:.9}
.ftk{fill:none;stroke-width:1;opacity:.45}
.ftk.ka{stroke:var(--a)}.ftk.kb{stroke:var(--b)}.ftk.kc{stroke:var(--c)}.ftk.kn{stroke:var(--net)}
.ft{font:600 10px var(--f-mono);paint-order:stroke;stroke:var(--bg);stroke-width:3px}
.ft.ka{fill:var(--a)}.ft.kb{fill:var(--b)}.ft.kc{fill:var(--c)}.ft.kn{fill:var(--net)}
.fl.ka{stroke:var(--a)}.fl.kb{stroke:var(--b)}.fl.kc{stroke:var(--c)}.fl.kn{stroke:var(--net)}
.fd.ka{fill:var(--a)}.fd.kb{fill:var(--b)}.fd.kc{fill:var(--c)}.fd.kn{fill:var(--net)}
.rk-d.sw .src{font-style:normal;font-size:9px;font-family:var(--f-body);border-radius:3px;padding:0 3px;margin-right:4px;color:#fff}
.rk-d.sw .src.ka{background:var(--a)}.rk-d.sw .src.kb{background:var(--b)}.rk-d.sw .src.kc{background:var(--c)}.rk-d.sw .src.kn{background:var(--net)}
.ck{font-family:var(--f-mono);font-size:11px;font-weight:600;border-radius:3px;padding:0 3px;line-height:1.5;white-space:nowrap}
.ck.ka{background:var(--a-soft);color:var(--a)}
.ck.kb{background:var(--b-soft);color:var(--b)}
.ck.kc{background:var(--c-soft);color:var(--c)}
.ck.kn{background:var(--net-soft);color:var(--net)}
@media (min-width:520px){.rk-grid{grid-auto-rows:minmax(26px,auto)}.ck{font-size:12px}}
.dacc{--a:#1f6fb8;--a-soft:#dde9f6;--b:#e8820c;--b-soft:#fde8d0}
.dacc .rk-d.srv .ck.ka{background:#e8820c;color:#fff}.dacc .rk-d.srv .ck.kb{background:#1f6fb8;color:#fff}
.hdc{font-weight:700;white-space:nowrap}.hdc::before{content:"";display:inline-block;width:.75em;height:.75em;border-radius:50%;background:currentColor;margin-right:3px;vertical-align:-1px}
.hd-b{color:#1f6fb8}.hd-o{color:#e8820c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hd-b{color:#6aaef0}:root:not([data-theme="light"]) .hd-o{color:#f2a04a}}
.hdtag{margin-left:8px;padding:0 6px;border-radius:3px;font-style:normal;font-weight:700}.hdtag.hd-b{background:#1f6fb8;color:#fff}.hdtag.hd-o{background:#e8820c;color:#fff}
.dacrule{font-size:13px;line-height:1.65;background:var(--panel);border:2px solid #e8820c;border-radius:6px;padding:8px 10px;margin-bottom:8px}
.dacl{font-size:13px;margin-top:3px}.dlen{font-weight:700;border-radius:3px;padding:0 5px;margin-left:4px;font-style:normal;font-family:var(--f-mono)}
.dlen.l25{background:#fde8d0;color:#a65300}.dlen.l20{background:var(--line);color:var(--ink)}
.rr.g3{border-bottom:1.5px solid var(--muted)}
</style>

/* ---------- access log (only when LOG_URL is set): IP via ipify, sent to the owner's Google Sheet ---------- */
let MYIP=null;
function logVisit(ev,extra){
  if(!LOG_URL)return;
  const send=ip=>{try{fetch(LOG_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
    body:JSON.stringify(Object.assign({ev,ip:ip||'',name:(LS.get('fi307_me')||''),lang:LANG,ua:navigator.userAgent,page:location.href,ts:new Date().toISOString()},extra||{}))}).catch(()=>{});}catch(e){}};
  if(MYIP!==null){send(MYIP);return;}
  fetch('https://api.ipify.org?format=json').then(r=>r.json()).then(j=>{MYIP=j.ip||'';send(MYIP);}).catch(()=>{MYIP='';send('');});
}

/* ---------- unlock ---------- */
async function decrypt(pass){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(pass.trim().toLowerCase()),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(BLOB.s),iterations:BLOB.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(BLOB.i)},key,b64(BLOB.c));
  const ds=new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip')));
  return JSON.parse(await ds.text());
}
async function unlock(pass,silent){
  const btn=$('#go'),msg=$('#lockmsg');
  btn.disabled=true;btn.textContent=L('验证中…','Checking…');msg.textContent='';
  try{
    const data=await decrypt(pass);
    LS.set('fi307_pass',pass.trim().toLowerCase());
    $('#lock').hidden=true;$('#app').hidden=false;
    init(data);
    logVisit(silent?'auto-unlock':'unlock');
    try{PROG.site=await sha256hex(pass.trim().toLowerCase());}catch(e){}
    if(!ME)await askName(true);
    try{await progLoad();if(PROG.ok&&ME)progCall({a:'hello',name:ME}).catch(()=>{});}catch(e){}
  }catch(e){
    LS.del('fi307_pass');
    if(!silent&&e&&e.name==='OperationError')logVisit('wrong-answer');
    if(!silent){msg.textContent=(e&&e.name==='OperationError')?L('答案不对，请再试一次。','Wrong answer, please try again.'):L('无法打开：','Cannot open: ')+(e.message||e)+L('（请用较新的浏览器）',' (please use a newer browser)');}
  }finally{btn.disabled=false;btn.textContent=L('进入','Enter');}
}

function markOf(k,x){const v=PROG.st[k+'|'+x];if(!v)return null;
  if(typeof v==='string'&&v.charAt(0)==='{'){try{const o=JSON.parse(v);return {t:o.t||'',by:o.by||'',p:o.p||''};}catch(e){}}

async function sha256hex(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
async function progCall(params){
  const u=new URL(STATUS_URL);u.searchParams.set('k',PROG.site);
  for(const [k,v] of Object.entries(params))u.searchParams.set(k,v);
  const r=await fetch(u.toString(),{cache:'no-store'});
  const j=await r.json();
  if(j&&j.st){PROG.st=j.st;PROG.ok=true;}
  return j||{};
}
async function progLoad(){
  if(!STATUS_URL||!PROG.site||PROG.busy)return;
  const was=PROG.ok;
  try{const j=await progCall({a:'list'});if(!j.ok)PROG.ok=false;}catch(e){PROG.ok=false;}
  const sig=JSON.stringify(PROG.st);
  if(was!==PROG.ok||sig!==PROG.sig){PROG.sig=sig;progRender();}
}
function progRender(){if(!D)return;renderGrid();if(state.cab)renderCab();renderFoot();}
function needOf(c){
  if(!c.need){const s=new Set();
    for(const [i,sd] of c.items){if(sd==='O')continue;const n=CATS[D[i][F.c]];if(n==='垂直')s.add('V');else if(n==='水平')s.add('H');}
    // 按 Excel 实际线路：有垂直线标 V（柜内服务器线），有水平线标 H（如 ASW→PSW 上联）；每柜只对应一个套餐
    c.need=PCATS.filter(x=>s.has(x));}
  return c.need;
}
const isDone=(k,x)=>!!PROG.st[k+'|'+x];
const fmtT=t=>{const d=new Date(t);if(isNaN(d))return '';const z=n=>String(n).padStart(2,'0');return `${z(d.getMonth()+1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`;};
// 机柜填绿：每柜只有一个套餐；V、H 各算一项（只有一项的柜完成即全绿；V+H 的柜完成一项绿一半，两项都完成全绿）
function progFrac(c){
  if(!PROG.ok)return null;const need=needOf(c);if(!need.length)return null;
  return {n:need.length,d:need.filter(x=>isDone(c.k,x)).length};
}
function progBadges(c){
  if(!PROG.ok)return '';const need=needOf(c);if(!need.length)return '';
  return `<span class="pb">${need.map(x=>`<i class="${isDone(c.k,x)?'on':''}">${esc(pcShort(x))}</i>`).join('')}</span>`;
}
function progSummary(list){
  if(!PROG.ok)return '';
  const parts=PCATS.map(x=>{const n=list.filter(c=>needOf(c).includes(x));if(!n.length)return '';
    return `<span>${esc(pcLabel(x))} <b>${n.filter(c=>isDone(c.k,x)).length}/${n.length}</b></span>`;}).filter(Boolean);
  if(!parts.length)return '';
  const all=list.filter(c=>needOf(c).length);
  return `<span>${L('布线进度：','Cabling progress:','Kaapeloinnin eteneminen:')}</span>${parts.join('')}<span>${L('整柜完成','Racks complete','Valmiit räkit')} <b>${all.filter(c=>needOf(c).every(x=>isDone(c.k,x))).length}/${all.length}</b></span>`;
}

function modal({title,body,yes,input,text,names,pick,required,noCancel,selLabel,onOpen}){return new Promise(res=>{
  const m=$('#modal'),inp=$('#minput'),sel=$('#msel'),warn=$('#mwarn');
  $('#mtitle').textContent=title;$('#mbody').innerHTML=body||'';
  $('#myes').textContent=yes;$('#mno').textContent=L('取消','Cancel','Peruuta');
  warn.hidden=true;
  // names: pick from list; text: free text; input: password
  const useSel=!!(names&&names.length);
  sel.hidden=!useSel;
  if(useSel){sel.innerHTML=`<option value="">${esc(selLabel||L('— 请选择 —','— choose —','— valitse —'))}</option>`+names.map(n=>`<option${n===pick?' selected':''}>${esc(n)}</option>`).join('');}
  $('#mno').hidden=!!noCancel;
  if(!useSel&&text){input=text;inp.type='text';}else inp.type='password';
  inp.hidden=!input;inp.value=(!useSel&&text&&pick)||'';inp.placeholder=input||'';
  const val=()=>useSel?sel.value:inp.value;
  m.hidden=false;(useSel?sel:input?inp:$('#mno')).focus();     // default focus on Cancel / the name field to avoid accidental confirms
  $('#mbody').onclick=e=>{const b=e.target.closest('[data-mres]');if(b)done(b.dataset.mres);};
  const done=v=>{m.hidden=true;$('#myes').onclick=$('#mno').onclick=m.onclick=$('#mbody').onclick=null;document.removeEventListener('keydown',kd);res(v);};
  const yesv=()=>{const v=(useSel||input)?val().trim():true;
    if(required&&!v){warn.textContent=useSel?L('请先选择','Please choose first','Valitse ensin'):L('请先填写名字','Please enter your name first','Kirjoita ensin nimesi');warn.hidden=false;return;}
    if(text&&!useSel&&v&&(v.length<2||v.length>30)){warn.textContent=L('名字请填 2–30 个字','Name must be 2–30 characters','Nimen pituus 2–30 merkkiä');warn.hidden=false;return;}
    done(v);};
  const kd=e=>{if(e.key==='Escape'){if(!noCancel)done(null);}else if(e.key==='Enter'&&(input||useSel)){e.preventDefault();yesv();}};
  document.addEventListener('keydown',kd);
  $('#myes').onclick=yesv;$('#mno').onclick=()=>done(null);
  m.onclick=e=>{if(e.target===m&&!noCancel)done(null);};
  if(onOpen)onOpen();
});}

async function progAsk(a,c,x){
  if(PROG.busy)return;
  const where=`${c.room} ${c.cab}`;
  let pkg='';
  if(a==='mark'){
    if(!ME&&!(await askName(true)))return;
    const pk=x==='V'?pkgsOf(c.k):[];
    const who=`<p>${L('完成人：','Done by:','Tekijä:')}<b>${esc(ME)}</b> <button type="button" class="linkbtn" id="mrename" data-mres="__rename__">${L('不是你？改名','Not you? Change name','Et ole tämä? Vaihda nimi')}</button></p>`;
    const pkgLine=pk.length===1?`<p>${L('套餐：','Package: ','Paketti: ')}<b>${esc(pk[0])}</b></p>`:pk.length>1?`<p><b>${L('这个柜有多个套餐，请选择完成的是哪个：','This rack has several packages — choose the one that is done:','Räkissä on useita paketteja — valitse valmis:')}</b></p>`:'';
    const ok=await modal({title:L('确认完成？','Confirm completion?','Vahvista valmistuminen?'),
      body:`<p>${L(`<b>${esc(where)}</b> 的<b>${esc(pcLabel(x))}</b>已全部完成？`,`Is all <b>${esc(pcLabel(x).toLowerCase())}</b> in <b>${esc(where)}</b> finished?`,`Onko <b>${esc(pcLabel(x).toLowerCase())}</b> räkissä <b>${esc(where)}</b> kokonaan valmis?`)}</p>${who}${pkgLine}
        <p class="sub">${L(`所有人都能看到完成人和时间。${UNDO_MIN} 分钟内你可以自己撤销，之后只有管理员能删除。`,`Everyone will see who finished it and when. You can undo it yourself within ${UNDO_MIN} minutes; after that only the administrator can remove it.`,`Kaikki näkevät tekijän ja ajan. Voit perua ${UNDO_MIN} minuutin sisällä; sen jälkeen vain ylläpitäjä voi poistaa.`)}</p>`,
      names:pk.length>1?pk:null,selLabel:L('— 选择套餐 —','— choose package —','— valitse paketti —'),required:pk.length>1,
      yes:L('确认完成','Yes, done','Kyllä, valmis')});
    if(ok==='__rename__'){if(await askName(false))progAsk(a,c,x);return;}
    if(!ok)return;
    pkg=pk.length>1?ok:(pk[0]||'');
  }else{
    const mk=markOf(c.k,x);
    const ok=await modal(a==='undo'?{title:L('撤销你的完成标记？','Undo your completion mark?','Perutaanko valmis-merkintäsi?'),body:`<p><b>${esc(where)}</b> · ${esc(pcLabel(x))}</p>`,yes:L('撤销','Undo','Peru')}
      :{title:L('清除完成标记？','Clear this completion mark?','Poistetaanko valmis-merkintä?'),body:`<p><b>${esc(where)}</b> · ${esc(pcLabel(x))}${mk&&mk.by?' · '+esc(mk.by):''}</p>`,yes:L('清除','Clear','Poista')});
    if(!ok)return;
  }
  PROG.busy=true;
  try{
    const j=await progCall(a==='mark'?{a:'mark',id:c.k,cat:x,by:ME,pkg}:a==='undo'?{a:'undo',id:c.k,cat:x,by:ME}:{a:'clear',id:c.k,cat:x,pin:PROG.admin});
    if(!j.ok){if(j.err==='admin-only'){PROG.admin='';LS.del('fi307_admin');}toast(errText(j.err||'?'));}
    else toast(a==='mark'?L(`已标记完成（${ME}）`,`Marked as done (${ME})`,`Merkitty valmiiksi (${ME})`):a==='undo'?L('已撤销','Undone','Peruttu'):L('已清除','Cleared','Poistettu'));
  }catch(e){toast(NETERR());}
  finally{PROG.busy=false;PROG.sig=JSON.stringify(PROG.st);progRender();}
}

/* ---------- app ---------- */
let META,PK,D,CATS,cabs,cabList,devIndex,state;
const F={c:0,ad:1,ar:2,ac:3,au:4,ao:5,zd:6,zr:7,zc:8,zu:9,zo:10,t:11,l:12,rt:13,oa:14,oz:15,al:16,row:17};
const key=(r,c)=>r+'|'+c;
const unum=u=>{const n=parseFloat(u);return isNaN(n)?-1:n};
const cabSort=(a,b)=>a.room.localeCompare(b.room)||a.cab.localeCompare(b.cab,undefined,{numeric:true});
const catName=i=>LANG==='en'?(CAT_EN[CATS[i]]||CATS[i]):LANG==='fi'?(CAT_FI[CATS[i]]||CATS[i]):CATS[i];

function init(data){
  META=data;D=data.rows;CATS=data.cats;PK=data.pk||null;cabs=new Map();devIndex=new Map();
  const add=(r,c,i,side)=>{if(!r)return;const k=key(r,c);let o=cabs.get(k);
    if(!o){o={k,room:r,cab:c,items:[],nA:0,nZ:0,nO:0};cabs.set(k,o);}o.items.push([i,side]);o['n'+side]++;};
  const addDev=(name,r,c,u)=>{if(!name||!r)return;const k=name+'@'+key(r,c);if(!devIndex.has(k))devIndex.set(k,{name,room:r,cab:c,u});};
  D.forEach((x,i)=>{
    add(x[F.ar],x[F.ac],i,'A');
    if(!(x[F.zr]===x[F.ar]&&x[F.zc]===x[F.ac]))add(x[F.zr],x[F.zc],i,'Z');
    for(const o of [x[F.oa],x[F.oz]]){if(o){const [r,c]=o.split(' ');add(r,c,i,'O');}}
    addDev(x[F.ad],x[F.ar],x[F.ac],x[F.au]);addDev(x[F.zd],x[F.zr],x[F.zc],x[F.zu]);
  });
  cabList=[...cabs.values()].sort(cabSort);
  const rooms=[...new Set(cabList.map(c=>c.room))];
  const savedRoom=LS.get('fi307_room');
  state={room:rooms.includes(savedRoom)||(savedRoom==='__pkg'&&PK)||savedRoom==='__prog'?savedRoom:rooms[0],pkg:null,cab:null,side:'all',cats:new Set(),gridOpen:true,view:null};
  $('#rooms').innerHTML=rooms.map(r=>`<button type="button" data-room="${esc(r)}">${esc(r)}</button>`).join('')+(PK?`<button type="button" class="pkgtab" data-room="__pkg"></button>`:'')+`<button type="button" class="pkgtab progtab" data-room="__prog" hidden></button>`;
  $('#rooms').onclick=e=>{const b=e.target.closest('button');if(!b)return;state.room=b.dataset.room;LS.set('fi307_room',state.room);state.gridOpen=true;if(state.room==='__prog'){state.cab=null;state.pkg=null;$('#cabview').hidden=true;}renderGrid();};
  $('#grid').addEventListener('click',e=>{const b=e.target.closest('[data-room-go]');if(b){state.room=b.dataset.roomGo;LS.set('fi307_room',state.room);state.gridOpen=true;renderGrid();}});
  $('#grid').onclick=e=>{const b=e.target.closest('.cab,[data-gok]');if(b){openCab(b.dataset.k||b.dataset.gok);return;}const p=e.target.closest('.pcard');if(p)openPkg(p.dataset.p);};
  $('#fold').onclick=()=>{state.gridOpen=!state.gridOpen;renderGrid();};
  renderFoot();
  setupSearch();
  const fromHash=decodeURIComponent(location.hash.slice(1)).replace('_','|');
  const last=cabs.has(fromHash)?fromHash:LS.get('fi307_cab');
  if(location.hash==='#pkg'&&PK){state.room='__pkg';renderGrid();}
  else{renderGrid();if(last&&cabs.has(last))openCab(last,true);}
  new ResizeObserver(()=>document.documentElement.style.setProperty('--hh',$('#hdr').offsetHeight+'px')).observe($('#hdr'));
}
function renderFoot(){

      <span class="n">${done?'✓ ':''}${esc(c.cab)}</span><span class="c">${odf?'ODF '+c.nO:(c.nA+c.nZ)+L(' 条',' links')}</span>${progBadges(c)}</button>`}).join('');

// 整体进度：各机房统计 + 全部完成记录（谁、哪个柜、何时）
function progAllHTML(){
  if(!PROG.ok)return `<div class="empty">${L('进度功能未开通或正在加载…','Progress is not set up yet or still loading…','Eteneminen ei ole käytössä tai latautuu…')}</div>`;
  const rooms=[...new Set(cabList.map(c=>c.room))];
  const rows=[];
  for(const c of cabList)for(const x of PCATS){const mk=markOf(c.k,x);if(mk&&needOf(c).includes(x))rows.push({c,x,mk});}
  rows.sort((a,b)=>String(b.mk.t).localeCompare(String(a.mk.t)));
  const per=new Map();for(const r of rows){const n=r.mk.by||L('（未记录）','(not recorded)','(ei kirjattu)');per.set(n,(per.get(n)||0)+1);}
  // 按套餐（垂直布线）：完成柜数 / 该套餐需要垂直布线的柜数
  const pstat=new Map();
  for(const c of cabList){if(!needOf(c).includes('V'))continue;const pk=pkgsOf(c.k);if(!pk.length)continue;
    const mk=markOf(c.k,'V');
    for(const p of pk){const s=pstat.get(p)||{n:0,d:0};s.n++;if(mk&&(!mk.p||mk.p===p))s.d++;pstat.set(p,s);}}
  const pkgRows=[...pstat].sort((a,b)=>b[1].n-a[1].n).map(([p,s])=>`<div class="pgroom"><span class="pgpk">${esc(p)}</span><span class="progsum"><span>${L('垂直布线','Vertical','Pysty')} <b>${s.d}/${s.n}</b></span></span></div>`).join('');
  const sumRows=rooms.map(rm=>{const s=progSummary(cabList.filter(c=>c.room===rm));return s?`<div class="pgroom"><button type="button" data-room-go="${esc(rm)}">${esc(rm)}</button><span class="progsum">${s}</span></div>`:''}).join('');
  return `<h2 class="pkh">${L('各机房进度','Progress by hall','Eteneminen saleittain')}</h2>${sumRows}
    ${pkgRows?`<h2 class="pkh">${L('按套餐（垂直布线）','By package (vertical cabling)','Paketeittain (pystykaapelointi)')}</h2>${pkgRows}`:''}
    ${per.size?`<h2 class="pkh">${L('按人员','By person','Henkilöittäin')}</h2><div class="pgper">${[...per].sort((a,b)=>b[1]-a[1]).map(([n,k])=>`<span><b>${esc(n)}</b> ${k}</span>`).join('')}</div>`:''}
    <h2 class="pkh">${L(`完成记录（${rows.length}）`,`Completion log (${rows.length})`,`Valmistumisloki (${rows.length})`)}</h2>
    ${rows.length?`<div class="pglog">${rows.map(r=>`<button type="button" data-gok="${esc(r.c.k)}"><span class="pgr">${esc(r.c.room)} <b>${esc(r.c.cab)}</b></span><span class="pgx">${esc(pcLabel(r.x))}${r.mk.p?` · <span class="pgp">${esc(r.mk.p)}</span>`:''}</span><span class="pgb">${esc(r.mk.by||'—')}</span><span class="pgt">${esc(fmtT(r.mk.t))}</span></button>`).join('')}</div>`
      :`<div class="empty">${L('还没有完成的机柜','No racks marked done yet','Ei vielä valmiita räkkejä')}</div>`}`;
}
function openPkg(name){
  state.pkg=name;state.cab=null;state.room='__pkg';state.gridOpen=false;LS.set('fi307_room','__pkg');
  try{history.replaceState(null,'','#pkg')}catch(e){}
  renderGrid();renderPkg();window.scrollTo({top:0});
}
function openCab(k,noScroll){
  const c=cabs.get(k);if(!c)return;
  state.cab=k;state.pkg=null;state.room=c.room;state.gridOpen=false;state.cats=new Set();state.view=null;state.sw=null;
  state.side=(c.nA+c.nZ===0)?'O':'all';
  LS.set('fi307_cab',k);LS.set('fi307_room',c.room);
  try{history.replaceState(null,'','#'+k.replace('|','_'))}catch(e){}
  renderGrid();renderCab();
  if(!noScroll)window.scrollTo({top:0});
}

function renderCab(){
  const c=cabs.get(state.cab),v=$('#cabview');v.hidden=false;
  const odfOnly=c.nA+c.nZ===0;
  let items=c.items.filter(([,s])=>state.side==='all'?s!=='O':s===state.side);
  const catsHere=[...new Set(items.map(([i])=>D[i][F.c]))].sort((a,b)=>a-b);
  if(state.cats.size)items=items.filter(([i])=>state.cats.has(D[i][F.c]));
  const groups=new Map();
  for(const [i,s] of items){const x=D[i];
    let name,u;
    if(s==='A'){name=x[F.ad];u=x[F.au];}else if(s==='Z'){name=x[F.zd];u=x[F.zu];}else{name=L('ODF 经过的线路','Links via this ODF');u='';}
    const gk=name+'#'+u;let g=groups.get(gk);if(!g){g={name,u,list:[]};groups.set(gk,g);}g.list.push([i,s]);}
  const gl=[...groups.values()].sort((a,b)=>unum(b.u)-unum(a.u)||a.name.localeCompare(b.name,undefined,{numeric:true}));
  gl.forEach(g=>g.list.sort((p,q)=>{const pa=D[p[0]],qa=D[q[0]];const po=p[1]==='Z'?pa[F.zo]:pa[F.ao],qo=q[1]==='Z'?qa[F.zo]:qa[F.ao];
    return String(po).localeCompare(String(qo),undefined,{numeric:true})}));

  const gid=PK&&PK.cab[state.cab],grp=gid&&PK.groups[gid],tp=grp&&PK.tpl[grp.pkg];
  const hasRack=!!(tp&&tp.lay);
  const vIdx=CATS.indexOf('垂直');
  const onlyVert=state.cats.size===1&&state.cats.has(vIdx);
  let view=state.view||(tp&&onlyVert?(hasRack?'rack':'rule'):state.cats.size?'compact':'card');
  if((view==='rule'&&!tp)||(view==='rack'&&!hasRack))view='compact';
  const compact=view==='compact',rule=view==='rule',rack=view==='rack',tpl=rule||rack;
  const views=(hasRack?[['rack',L('机柜接线图','Rack map')]]:[]).concat(tp?[['rule',L('接线规律','Port rule')]]:[]).concat([['compact',L('精简图','Compact')],['card',L('详细卡片','Details')]]);
  const segBtns=odfOnly?[['O',L('经过本 ODF','Via this ODF')]]:[['all',L('全部','All')],['A',L('本柜为源端','As A end')],['Z',L('本柜为宿端','As Z end')]].concat(c.nO?[['O','ODF']]:[]);
  const nDev=new Set(c.items.filter(x=>x[1]!=='O').map(([i,s])=>s==='A'?D[i][F.ad]:D[i][F.zd])).size;
  v.innerHTML=`
   <div class="cabhead"><h1><small>${esc(c.room)}</small>${esc(c.cab)}</h1>
     <span class="sum">${odfOnly?L(`ODF 柜 · ${c.nO} 条经过`,`ODF rack · ${c.nO} links pass`,`ODF-räkki · ${c.nO} yhteyttä kulkee`):L(`源端 ${c.nA} · 宿端 ${c.nZ} · 设备 ${nDev} 台`,`A end ${c.nA} · Z end ${c.nZ} · ${nDev} device${nDev===1?'':'s'}`,`A-pää ${c.nA} · Z-pää ${c.nZ} · ${nDev} ${nDev===1?'laite':'laitetta'}`)}</span></div>
   ${progPanel(c)}
   ${tp?pkgBar(grp,tp,c,tpl,hasRack):''}
   <div class="seg" role="group"${tpl?' hidden':''}>${segBtns.map(([k,t])=>`<button type="button" data-side="${k}" aria-pressed="${state.side===k}">${t}</button>`).join('')}</div>
   <div class="chips" role="group">${catsHere.map(ci=>`<button type="button" class="chip" data-cat="${ci}" aria-pressed="${state.cats.has(ci)}">${esc(catName(ci))}</button>`).join('')}</div>
   <div class="vseg" role="group">${views.map(([k,t])=>`<button type="button" data-view="${k}" aria-pressed="${view===k}">${t}</button>`).join('')}</div>
   ${rack?rackHTML(grp,tp):''}
   ${rule?ruleHTML(grp,tp,c):''}
   ${compact&&items.length?typeSummary(items):''}
   ${compact?(items.length?summaryHTML(items,c):`<div class="empty">${L('没有符合条件的线路','No matching links')}</div>`):''}
   ${tpl?'':!compact&&gl.length>1?`<div class="elev">${gl.map((g,gi)=>`<button type="button" data-jump="g${gi}"><b>${g.u?'U'+esc(g.u):'—'}</b>${T(g.name)}</button>`).join('')}</div>`:''}
   ${compact||tpl?'':gl.length?gl.map((g,gi)=>`<div class="dev" id="g${gi}">
      <div class="devh">${g.u?`<span class="u">U${esc(g.u)}</span>`:''}<span class="name">${T(g.name)}</span><span class="cnt">${g.list.length}${L(' 条',' links')}</span></div>
      ${g.list.map(([i,s])=>lineHTML(D[i],s,c)).join('')}</div>`).join(''):`<div class="empty">${L('没有符合条件的线路','No matching links')}</div>`}`;
  if(rack)hookFlows();
  v.onclick=e=>{
    const t=e.target.closest('button');if(!t)return;
    if(t.dataset.pmark){progAsk('mark',c,t.dataset.pmark);return;}
    if(t.dataset.pclr){progAsk('clear',c,t.dataset.pclr);return;}
    if(t.dataset.pundo){progAsk('undo',c,t.dataset.pundo);return;}
    if(t.dataset.side){state.side=t.dataset.side;state.cats=new Set();renderCab();}
    else if(t.dataset.view){state.view=t.dataset.view;if(t.dataset.view==='rack'||t.dataset.view==='rule'){if(!(state.cats.size===1&&state.cats.has(vIdx)))state.cats=new Set([vIdx]);}renderCab();}
    else if(t.dataset.sw){state.sw=+t.dataset.sw;renderCab();}
    else if(t.dataset.cat){state.view=null;const n=+t.dataset.cat;state.cats.has(n)?state.cats.delete(n):state.cats.add(n);renderCab();}
    else if(t.dataset.jump){const el=document.getElementById(t.dataset.jump);if(el)window.scrollTo({top:el.getBoundingClientRect().top+scrollY-$('#hdr').offsetHeight-4});}
    else if(t.dataset.go){const keep=state.view;openCab(t.dataset.go);if(keep==='rack'||keep==='rule'){state.cats=new Set([vIdx]);state.view=keep;renderCab();}}
  };
}

function dacLine(x,ln){
  if(!ln||!/^ASW/i.test(x[F.ad]))return '';
  const tp=tpOf(key(x[F.ar],x[F.ac]));if(!tp||!tp.dac)return '';
  const h=tp.dac.hd[ln[0]];if(!h)return '';
  return `<div class="dacl">${L('交换机端','Switch end','Kytkinpää')} ${hdChip(h)} → ${L('服务器端','server end','palvelinpää')} ${hdChip(hdOther(h))}${lenTag(dacLen(tp,x[F.ao]))}</div>`;
}
function lineHTML(x,s,c){
  let myPort,pr,pc,pu,pd,po,tag;
  const intra=x[F.ar]===x[F.zr]&&x[F.ac]===x[F.zc];
  if(s==='Z'){myPort=x[F.zo];pr=x[F.ar];pc=x[F.ac];pu=x[F.au];pd=x[F.ad];po=x[F.ao];tag=intra?`<span class="dir in">${L('柜内','In rack')}</span>`:`<span class="dir from">${L('← 源端','← A end')}</span>`;}
  else if(s==='A'){myPort=x[F.ao];pr=x[F.zr];pc=x[F.zc];pu=x[F.zu];pd=x[F.zd];po=x[F.zo];tag=intra?`<span class="dir in">${L('柜内','In rack')}</span>`:`<span class="dir to">${L('→ 宿端','→ Z end')}</span>`;}

/* ---------- flow lines: switch (source) → side bus of each target rack ---------- */
function drawFlows(root){
  (root||document).querySelectorAll('.rk-flowwrap').forEach(wrap=>{
    let flows;try{flows=JSON.parse(wrap.dataset.flows)}catch(e){return}
    wrap.querySelectorAll('svg.rk-svg').forEach(s=>s.remove());
    const nR=wrap.querySelectorAll('.rk').length;
    wrap.classList.toggle('noflow',wrap.clientWidth/Math.max(1,nR)<165);   // 太窄（如手机上 3 柜并排）时不画走线
    if(wrap.classList.contains('noflow'))return;
    const W=wrap.getBoundingClientRect();if(!W.width)return;
    const NS='http://www.w3.org/2000/svg';
    const svg=document.createElementNS(NS,'svg');svg.setAttribute('class','rk-svg');
    svg.setAttribute('width',W.width);svg.setAttribute('height',W.height);
    const rel=r=>({l:r.left-W.left,r:r.right-W.left,t:r.top-W.top,b:r.bottom-W.top});
    const lanes=Math.max(1,flows.length),gap=7;
    const gridOf=role=>wrap.querySelector(`.rk[data-role="${role}"] .rk-grid`);
    const laneX=(role,i)=>{const g=gridOf(role);if(!g)return null;return rel(g.getBoundingClientRect()).l-6-i*gap;};
    const topY=i=>14+i*15;
    for(const f of flows){
      const [srole]=f.sw.split('|');
      const swEl=wrap.querySelector(`.rk[data-role="${srole}"] [data-sw="${CSS.escape(f.sw)}"]`);if(!swEl)continue;
      const s=rel(swEl.getBoundingClientRect()),sy=(s.t+s.b)/2;
      const sx0=laneX(srole,f.lane);
      for(const t of f.t){
        const g=gridOf(t.r);if(!g)continue;
        const cells=t.us.map(u=>wrap.querySelector(`.rk[data-role="${t.r}"] .rk-d.srv[data-b="${u}"]`)).filter(Boolean).map(e=>rel(e.getBoundingClientRect()));
        if(!cells.length)continue;
        const tx=laneX(t.r,f.lane),ys=cells.map(c=>(c.t+c.b)/2),y1=Math.min(...ys),y2=Math.max(...ys),edge=rel(g.getBoundingClientRect()).l;
        // 每段线都从上方标注线号段：本柜 ↓，去别柜 → / ←
        const ty=topY(f.lane);
        let d=`M${s.l} ${sy} H${sx0}`;
        if(t.r===srole){d+=` V${sy<y1?y1:y2} M${sx0} ${sy} V${ty}`;}
        else{d+=` V${ty} H${tx} V${y1}`;}
        const arrow=t.r===srole?'↓':(tx<sx0?'←':'→');
        const lbl={x:tx+5,y:ty-3,txt:arrow==='←'?'← '+t.lab:t.lab+' '+arrow};
        d+=` M${tx} ${y1} V${y2}`;
        let tk='';for(const y of ys)tk+=`M${tx} ${y} H${edge-1} `;
        const add=(tag,attrs)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);svg.appendChild(e);return e;};
        add('path',{d,class:'fl '+f.cls});
        add('path',{d:tk,class:'ftk '+f.cls});
        const tx_=add('text',{x:lbl.x,y:lbl.y,class:'ft '+f.cls,'text-anchor':'start'});tx_.textContent=lbl.txt;
        const dot=document.createElementNS(NS,'circle');dot.setAttribute('cx',s.l);dot.setAttribute('cy',sy);dot.setAttribute('r',3.5);dot.setAttribute('class','fd '+f.cls);svg.appendChild(dot);
      }
    }
    wrap.appendChild(svg);
  });
}

  const v=$('#cabview');v.hidden=false;
  const p=pkgList().find(x=>x.name===state.pkg);if(!p){v.hidden=true;return;}
  const roles=Object.keys(p.gs[0]?p.gs[0].cabs:{}).sort();
  const vIdx=CATS.indexOf('垂直');
  v.innerHTML=`<div class="cabhead"><h1 style="font-size:28px">${esc(p.name)}</h1></div>
    ${p.tp.layName&&p.tp.layName!==p.name?`<div class="sub">${L('套餐视图里叫','Called in package view: ')}<b>${esc(p.tp.layName)}</b></div>`:''}
    <div class="pkgstat">${L(`${p.gs.length} 组 · ${p.nCab} 个机柜${p.nSrv?' · '+p.nSrv+' 台服务器':''} · 每组 ${roles.length} 柜（${roles.map(rk).join(' / ')}）`,`${p.gs.length} groups · ${p.nCab} racks${p.nSrv?' · '+p.nSrv+' servers':''} · ${roles.length} rack(s) per group (${roles.map(rk).join(' / ')})`,`${p.gs.length} ryhmää · ${p.nCab} räkkiä${p.nSrv?' · '+p.nSrv+' palvelinta':''} · ${roles.length} räkkiä/ryhmä (${roles.map(rk).join(' / ')})`)}
      · ${p.tp.same===p.tp.total?L('各组接线完全相同','wiring identical in every group'):L(`${p.tp.same}/${p.tp.total} 组接线相同`,`${p.tp.same}/${p.tp.total} groups identical`,`${p.tp.same}/${p.tp.total} ryhmää samanlaisia`)}</div>
    <h2 class="pkh">${L('机柜清单','Racks')}</h2>
    <div class="pgroups">${p.gs.slice().sort((a,b)=>Object.values(a.cabs).sort()[0].localeCompare(Object.values(b.cabs).sort()[0],undefined,{numeric:true})).map((g,i)=>`<div class="pg"><span class="pgn">${i+1}</span>
      ${roles.map(r=>g.cabs[r]?`<button type="button" data-go="${esc(g.cabs[r])}"><small>${esc(rk(r))}</small>${esc(g.cabs[r].replace('|',' '))}</button>`:'').join('')}${g.diff?`<b class="warn">${L('与规律不同','differs')}</b>`:''}</div>`).join('')}</div>
    ${p.tp.lay?`<h2 class="pkh">${L('通用接线图（所有组相同）','Generic wiring map (same for all groups)')}</h2>${mapLink(p.name)}${rackHTML(null,p.tp)}`:`<div class="empty">${L('套餐视图里没有这个套餐的示意图','No layout for this package in the package view')}</div>`}`;
  hookFlows();
  v.onclick=e=>{const t=e.target.closest('button');if(!t||!t.dataset.go)return;openCab(t.dataset.go);state.cats=new Set([vIdx]);state.view=p.tp.lay?'rack':'rule';renderCab();};
}

function ruleHTML(grp,tp,c){
  const sws=tp.sw;
  let si=state.sw;
  if(si==null||!sws[si]){si=sws.findIndex(s=>grp.cabs[s.role]===state.cab);if(si<0)si=0;}
  const sw=sws[si],swCab=grp.cabs[sw.role];
  const cols=[];const byRole=new Map();
  for(const p of sw.ports){if(!byRole.has(p[1])){const col={role:p[1],ports:[]};byRole.set(p[1],col);cols.push(col);}byRole.get(p[1]).ports.push(p);}
  const multi=sw.ports.some(p=>p[2].length>1);
  const nCab=sw.ports.reduce((n,p)=>n+p[2].length,0);
  return `<div class="swtabs" role="group">${sws.map((s,i)=>`<button type="button" data-sw="${i}" aria-pressed="${i===si}">
      <b>${esc(s.kind)}${/^ASW/i.test(s.kind)?' '+esc(aswLetter(tp,s.role,s.u)):''}</b><span>${esc(cabName(grp.cabs[s.role]||'?'))} U${esc(s.u)}</span>${tp.dac&&/^ASW/i.test(s.kind)&&tp.dac.hd[aswLetter(tp,s.role,s.u)]?hdChip(tp.dac.hd[aswLetter(tp,s.role,s.u)]):''}</button>`).join('')}</div>
    <div class="rulehead"><b>${esc(sw.kind)}</b> ${L('在','in')} <b>${esc(cabName(swCab))}</b>（${esc(rk(sw.role))}） <span class="su">U${esc(sw.u)}</span>
      ${tp.dac&&/^ASW/i.test(sw.kind)&&tp.dac.hd[aswLetter(tp,sw.role,sw.u)]?(h=>`<div class="dacl">${L('交换机插','Switch takes the','Kytkin ottaa')} ${hdChip(h)} → ${L('服务器端','server end','palvelinpää')} ${hdChip(hdOther(h))}</div>`)(tp.dac.hd[aswLetter(tp,sw.role,sw.u)]):''}<div class="sub">${T(sw.t)}${tp.dac&&/^ASW/i.test(sw.kind)?'':sw.l?' · '+esc(sw.l)+'m':''} · ${L(`共 ${nCab} 根`,`${nCab} cables`,`${nCab} kaapelia`)}${multi?L('（1分2：一个口接两台）',' (1-to-2: one port feeds two servers)'):''}</div></div>
    <div class="rcols" style="--n:${cols.length}">${cols.map(col=>{const k=grp.cabs[col.role];const sp=[...new Set(col.ports.map(p=>p[3]))];
      return `<div class="rcol"><div class="rch${k===state.cab?' me':''}">→ ${esc(cabName(k||'?'))}<small>${esc(rk(col.role))}${k===state.cab?L('·本柜',' · here'):''}${sp.length===1?L(' · 服务器口 ',' · server port ')+esc(sp[0]):''}</small></div>
        ${col.ports.map((p,pi)=>{const ln=swLabel(tp,sw,p[0]);const dl=/^ASW/i.test(sw.kind)?dacLen(tp,p[0]):'';const g3=tp.dac&&/^ASW/i.test(sw.kind)&&pi%3===2?' g3':'';
          if(p[2].length>1){const us=[...p[2]].sort((a,b)=>a-b);
            return `<div class="rr rr2"><span class="rp">${esc(ln)}</span><span class="subs">${us.map((u,j)=>`<span class="sub1"><b>${esc(ln)}${'AB'[j]||j+1}</b> U${esc(u)}</span>`).join('')}</span></div>`;}
          return `<div class="rr${g3}"><span class="rp">${esc(ln)}</span><span class="ru">${p[2].map(u=>'U'+esc(u)).join(' / ')}</span>${lenTag(dl)}${sp.length>1?`<i>${esc(P(p[3]))}</i>`:''}</div>`}).join('')}</div>`}).join('')}</div>
    <div class="legend">${L(`左列为<b>线号</b>（= 交换机口号）：OAWS 为 1–48；ASW 按所在柜标 A1–A24 / B1–B24${sws.some(s=>s.role==='C')?' / C1–C24':''}。右列为对端服务器 U 位（设备起始 U，与 Excel U位 列一致）。`,
      `Left: <b>cable label</b> (= switch port). OAWS is 1–48; ASW is labelled by its rack, A1–A24 / B1–B24${sws.some(s=>s.role==='C')?' / C1–C24':''}. Right: server U position (start U, same as the Excel U column). `,
      `Vasemmalla <b>kaapelitunnus</b> (= kytkimen portti). OAWS on 1–48; ASW merkitään räkin mukaan A1–A24 / B1–B24${sws.some(s=>s.role==='C')?' / C1–C24':''}. Oikealla palvelimen U-paikka (alku-U, sama kuin Excelin U-sarake). `)}${tp.lay&&sws.some(s=>s.kind==='OAWS')?L('OAWS 线号 n = 从下往上第 n 台服务器（A柜 1–24，B柜 25–48）。','OAWS label n = the n-th server counted from the bottom (Rack A 1–24, Rack B 25–48). '):''}${multi?L('1分2 线：母头标线号（如 A1），两个子头标 A1A、A1B，<b>子头 A 接低 U 位，子头 B 接高 U 位</b>。','1-to-2 cables: the main head carries the label (e.g. A1), the two breakout heads are A1A and A1B — <b>head A to the lower U, head B to the higher U</b>. '):''}${L('同套餐其他组按 A/B 柜位置套用同一规律。','Other groups of this package follow the same rule by rack position A/B.')}</div>`;
}
function rng(arr){
  const vals=[...new Set(arr.filter(v=>v!==''&&v!=null).map(String))];
  if(!vals.length)return '';
  const nums=vals.filter(v=>/^\d+$/.test(v)).map(Number).sort((a,b)=>a-b),txt=vals.filter(v=>!/^\d+$/.test(v));
  const out=[];if(nums.length){let s=nums[0],p=nums[0];for(const x of nums.slice(1).concat([NaN])){if(x===p+1){p=x;continue}out.push(s===p?''+s:s+'-'+p);s=p=x;}}
  return out.concat(txt.sort()).join(',');
}
function devRange(names){
  const u=[...new Set(names.filter(Boolean))];if(u.length<=1)return u[0]||'';
  const m=u[0].match(/^(.*?)(\d+)$/);
  if(m&&u.every(x=>x.startsWith(m[1])&&/^\d+$/.test(x.slice(m[1].length))))return m[1]+rng(u.map(x=>x.slice(m[1].length))).replace(/-/g,'~');
  return u.length>3?u.slice(0,3).join(' / ')+L(` 等${u.length}台`,` +${u.length-3} more`,` +${u.length-3} muuta`):u.join(' / ');
}
const fmtU=s=>String(s).split(',').map(x=>`<span class="nw">${esc(x)}</span>`).join(',<wbr>');
function summaryHTML(items,c){
  const big=new Map();
  for(const [i,s] of items){const x=D[i];if(s==='O')continue;
    const A=s==='A';const Lo={d:A?x[F.ad]:x[F.zd],u:A?x[F.au]:x[F.zu],p:A?x[F.ao]:x[F.zo]},
      Pe={r:A?x[F.zr]:x[F.ar],c:A?x[F.zc]:x[F.ac],d:A?x[F.zd]:x[F.ad],u:A?x[F.zu]:x[F.au],p:A?x[F.zo]:x[F.ao]};
    const intra=x[F.ar]===x[F.zr]&&x[F.ac]===x[F.zc];
    const k=[s,Pe.r,Pe.c,x[F.t],x[F.c]].join('|');let g=big.get(k);
    if(!g){g={s,intra,P:Pe,t:x[F.t],l:new Set(),cat:x[F.c],rows:[]};big.set(k,g);}
    g.rows.push({L:Lo,P:Pe,rt:x[F.rt]});if(x[F.l])g.l.add(x[F.l]);}
  const lines=[];
  for(const g of big.values()){
    const nL=new Set(g.rows.map(r=>r.L.d)).size,nP=new Set(g.rows.map(r=>r.P.d)).size;
    const byLocal=nL<=nP;const sub=new Map();
    for(const r of g.rows){const k=byLocal?r.L.d:r.P.d;if(!sub.has(k))sub.set(k,[]);sub.get(k).push(r);}
    for(const rs of sub.values())lines.push({g,rs});
  }
  lines.sort((a,b)=>(Math.max(...b.rs.map(r=>+r.L.u||0)))-(Math.max(...a.rs.map(r=>+r.L.u||0))));
  return `<div class="legend">${L('<span class="to">→</span> 本柜为源端，去往宿端 · <span class="from">←</span> 本柜为宿端，来自源端 · 点对端机柜可跳转','<span class="to">→</span> this rack is the A end · <span class="from">←</span> this rack is the Z end · tap a rack to jump')}</div>
  <div class="sumlist">${lines.map(({g,rs})=>{
    const lu=rng(rs.map(r=>r.L.u)),pu=rng(rs.map(r=>r.P.u));
    const arrow=g.intra?'↔':g.s==='A'?'→':'←',cls=g.intra?'in':g.s==='A'?'to':'from';
    const cab=g.P.r?(g.P.r===c.room?'':g.P.r+' ')+g.P.c:L('外部','External');
    const rts=[...new Set(rs.map(r=>r.rt).filter(Boolean))].sort().join('/');
    return `<div class="srow">
      <div class="sl"><span class="su">U${fmtU(lu||'?')}</span> ${T(devRange(rs.map(r=>r.L.d)))} <i>${esc(P(rng(rs.map(r=>r.L.p))))}</i></div>
      <div class="sp"><b class="sa ${cls}">${arrow}</b>${g.P.r?`<button type="button" data-go="${esc(key(g.P.r,g.P.c))}">${esc(cab)}</button>`:esc(cab)}
        <span class="su">U${fmtU(pu||'?')}</span> ${T(devRange(rs.map(r=>r.P.d)))} <i>${esc(P(rng(rs.map(r=>r.P.p))))}</i></div>
      <div class="sm"><b>×${rs.length}</b> ${T(g.t||'')}${g.l.size?' · '+esc([...g.l].join('/'))+'m':''}${rts?` · <span class="r${esc(rts)}">${L('路由','Route')} ${esc(rts)}</span>`:''}</div>
    </div>`}).join('')}</div>`;
}
function typeSummary(items){
  const t=new Map();
  for(const [i] of items){const x=D[i];const k=(x[F.t]||L('未注明','n/a'))+(x[F.l]?` · ${x[F.l]}m`:'');t.set(k,(t.get(k)||0)+1);}
  return `<div class="tsum">${[...t].map(([k,n])=>`<span><b>${n}</b> × ${T(k)}</span>`).join('')}</div>`;
}
function metaHTML(x){
  const m=[`<span>${esc(catName(x[F.c]))}</span>`];
  if(x[F.t])m.push(`<span>${T(x[F.t])}</span>`);
  if(x[F.l])m.push(`<span>${esc(x[F.l])} m</span>`);
  if(x[F.rt])m.push(`<span class="${x[F.rt]==='A'?'ra':x[F.rt]==='B'?'rb':''}">${L('路由','Route')} ${esc(x[F.rt])}</span>`);
  if(x[F.oa]||x[F.oz])m.push(`<span>ODF ${esc([x[F.oa],x[F.oz]].filter(Boolean).join(' → '))}${x[F.al]?' ('+esc(x[F.al])+'m)':''}</span>`);
  m.push(`<span>${L('表行','Row')} ${x[F.row]}</span>`);
  return `<div class="meta">${m.join('')}</div>`;
}

function setupSearch(){
  const q=$('#q'),res=$('#res');
  let hits=[];
  const run=()=>{
    const s=q.value.trim().toLowerCase().replace(/\s+/g,' ');
    if(!s){res.hidden=true;return;}
    hits=[];
    for(const c of cabList){const full=(c.room+' '+c.cab).toLowerCase();
      if(c.cab.toLowerCase()===s||full.includes(s)||c.cab.toLowerCase().startsWith(s))hits.push({k:c.k,label:L('机柜 ','Rack ')+`${c.room} ${c.cab}`,sub:(c.nA+c.nZ)?(c.nA+c.nZ)+L(' 条',' links'):'ODF'});}
    let n=0;
    for(const d of devIndex.values()){if(n>=40)break;
      if(d.name.toLowerCase().includes(s)){hits.push({k:key(d.room,d.cab),label:tx(d.name),sub:`${d.room} ${d.cab} U${d.u}`});n++;}}
    hits=hits.slice(0,50);
    res.innerHTML=hits.length?hits.map((h,i)=>`<button type="button" data-i="${i}"><span>${esc(h.label)}</span><span class="k mono">${esc(h.sub)}</span></button>`).join(''):`<div class="empty">${L('无匹配','No match')}</div>`;
    res.hidden=false;
  };
  q.addEventListener('input',run);
  q.addEventListener('focus',run);
  q.addEventListener('keydown',e=>{if(e.key==='Enter'&&hits[0]){pick(hits[0]);}if(e.key==='Escape'){res.hidden=true;q.blur();}});
  res.addEventListener('click',e=>{const b=e.target.closest('button');if(b)pick(hits[+b.dataset.i]);});
  document.addEventListener('click',e=>{if(!e.target.closest('.search'))res.hidden=true;});
  function pick(h){res.hidden=true;q.value='';q.blur();openCab(h.k);}
}
})();
</script>
</body>
