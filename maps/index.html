<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FI307 接线图</title>
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#18212b;--muted:#5d6b7a;--line:#d5dbe2;--accent:#e2701b;--accent-soft:#fbe7d6;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#12171d;--panel:#1b222a;--ink:#e6ebf0;--muted:#93a1b0;--line:#2c3640;--accent:#f08a3a;--accent-soft:#3a2716;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-left,0px)) 32px max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:10px}
h1{font-size:24px;margin:0;flex:1;min-width:0}
h1 a{color:inherit;text-decoration:none}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font:inherit;font-weight:700;color:inherit;cursor:pointer;text-decoration:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:10px}
.tabs button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font:inherit;font-weight:600;color:inherit;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.meta{color:var(--muted);font-size:13px;padding-bottom:8px}
.meta a{color:var(--accent);font-weight:600}
figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px}
figure img{display:block;width:100%;height:auto}
.note{font-size:12px;color:var(--muted);padding-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">FI307 接线图</h1>
    <a class="btn" id="back" href="../">查询工具</a>
    <select class="btn" id="lang" aria-label="Language"><option value="zh">中文</option><option value="en">EN</option><option value="fi">FI</option></select>
  </header>
  <div class="tabs" id="tabs" role="group"></div>
  <div class="meta" id="meta"></div>
  <figure><a id="full" href="#" target="_blank" rel="noopener"><img id="img" alt=""></a></figure>
  <div class="note" id="note"></div>
</div>
<script>
const PK=[
  {k:'NEW',name:'44U-2-2.48-HY-NEW',zh:'26 套 × 2 柜（A/B）· DAC 200G 1分2',en:'26 sets × 2 racks (A/B) · DAC 200G 1-to-2',fi:'26 sarjaa × 2 räkkiä (A/B) · DAC 200G 1→2'},
  {k:'TOR',name:'44U-3-TOR-Gen-100G-48-F-STD',zh:'5 套 × 3 柜（A/B/C）· AOC 200G 1分2',en:'5 sets × 3 racks (A/B/C) · AOC 200G 1-to-2',fi:'5 sarjaa × 3 räkkiä (A/B/C) · AOC 200G 1→2'},
  {k:'MOR',name:'44U-1-MOR-EBS-100G-24-F-STD（手搓套餐）',zh:'6 个单柜 · DAC 100G 直连',en:'6 single racks · DAC 100G direct',fi:'6 yksittäistä räkkiä · DAC 100G suora'},
  {k:'POP',name:'44U-2-TOR-Gen-100G-48-F-STD（ASW-POP）',zh:'2 套 × 2 柜：A0-3 E08/E09、F08/F09 · AOC 10G 直连',en:'2 sets × 2 racks: A0-3 E08/E09, F08/F09 · AOC 10G direct',fi:'2 sarjaa × 2 räkkiä: A0-3 E08/E09, F08/F09 · AOC 10G suora'},
  {k:'HY',name:'44U-2-2.24-HY',zh:'3 套 × 2 柜：A0-2 G07–G12 · DAC 200G 直连（A-ASW 插蓝头、B-ASW 插橙头）+ OAWS U21 网线',en:'3 sets × 2 racks: A0-2 G07–G12 · DAC 200G direct (A-ASW blue heads, B-ASW orange heads) + OAWS U21 RJ45',fi:'3 sarjaa × 2 räkkiä: A0-2 G07–G12 · DAC 200G suora + OAWS U21 RJ45'}
];
let lang;try{lang=localStorage.getItem('fi307_lang')}catch(e){}
const nl=(navigator.language||'').toLowerCase();
if(!['zh','en','fi'].includes(lang))lang=nl.startsWith('zh')?'zh':nl.startsWith('fi')?'fi':'en';
const L=(zh,en,fi)=>lang==='zh'?zh:lang==='fi'?fi:en;
let cur=(location.hash.slice(1)||'NEW').toUpperCase();if(!PK.some(p=>p.k===cur))cur='NEW';
const $=s=>document.querySelector(s);
function render(){
  const zh=lang==='zh',p=PK.find(x=>x.k===cur),src=`${p.k}-${zh?'zh':'en'}.png`;   // images exist in CN/EN only; Finnish UI uses the English image
  document.documentElement.lang=zh?'zh-CN':lang;
  document.title=L('FI307 接线图','FI307 Wiring Maps','FI307 Kytkentäkuvat');
  $('#title').textContent=document.title;
  $('#back').textContent=L('查询工具','Lookup tool','Hakutyökalu');
  $('#lang').value=lang;
  $('#tabs').innerHTML=PK.map(x=>`<button type="button" data-k="${x.k}" aria-pressed="${x.k===cur}">${x.k}</button>`).join('');
  $('#meta').innerHTML=`<b>${p.name}</b> · ${L(p.zh,p.en,p.fi)} · <a href="${src}" download>${L('下载图片','Download image','Lataa kuva')}</a>`;
  $('#img').src=src;$('#img').alt=p.name;$('#full').href=src;
  $('#note').textContent=L('点图片可在新窗口打开原图，方便放大或打印。每个 U 位上标的就是要插进这台服务器的线；彩色走线标出线从哪台交换机（源头）出发。','Tap the image to open it full size for zooming or printing. Each U shows the labels that plug into that server; the coloured routes show which switch (source) each cable comes from.','Napauta kuvaa avataksesi sen täysikokoisena zoomausta tai tulostusta varten. Jokaisessa U-paikassa näkyvät tunnukset, jotka kytketään kyseiseen palvelimeen; värilliset reitit näyttävät, mistä kytkimestä (lähteestä) kukin kaapeli tulee. Kuvan tekstit ovat englanniksi.');
  try{history.replaceState(null,'','#'+cur)}catch(e){}
}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b){cur=b.dataset.k;render();}});
$('#lang').addEventListener('change',e=>{lang=e.target.value;try{localStorage.setItem('fi307_lang',lang)}catch(e){}render();});
render();
</script>
</body>
</html>
